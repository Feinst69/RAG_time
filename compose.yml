services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API HTTP 
      - "6334:6334" # API gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=1 # Active l'interface Web
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - rag-time-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    container_name: search_api
    build:
      context: .
      dockerfile: search_api/Dockerfile
    env_file:
      - .env
    volumes:
      - ./hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - rag-time-net
networks:
  rag-time-net:
    driver: bridge