retrieval:
  # Eval uses collections prefixed with this value (e.g. eval_support_tickets).
  # The production collection (support_tickets) is never touched by the eval pipeline.
  eval_collection_prefix: "eval_"
  dataset_path: "data/aa_sample.csv"

  k:
    - 5
    - 10

  candidates:
    - 50
    - 100

  q_&_a_pairs:
    - question: "Hello, I am having audio issues with my computer. The sound is very low and distorted. I have tried adjusting the volume and checking the audio settings, but it hasn't helped. Can you please assist me in resolving this issue?"                                                           
      relevant_ids:                                                                              
        - "6089b1ac-f859-5c11-acf7-3ad32a77b49c"   
    - question: "Hello, I am experiencing connectivity issues with the cloud services for my phone"
      relevant_ids:
        - "6b39077b-17e2-5a89-98cb-e03f64c72cea"
        - "4c6c61ab-3b04-56f6-b3fd-782ccf6b59b3"

  retrieval_models:
    # PyLate ColBERT model used for dense retrieval (mean-pooled token embeddings)
    dense: 
      # - mixedbread-ai/mxbai-edge-colbert-v0-17m
      - mixedbread-ai/mxbai-edge-colbert-v0-32m
      - LiquidAI/LFM2-ColBERT-350M
    # fastembed BM25 model for sparse retrieval
    sparse: 
      -   Qdrant/bm25
      -   prithivida/Splade_PP_en_v1
    # PyLate ColBERT model used for late-interaction reranking (MaxSim)
    reranker: 
      - mixedbread-ai/mxbai-edge-colbert-v0-32m
      - LiquidAI/LFM2-ColBERT-350M

  query_rephrasing: 
    - true
    - false

  # metrics: 
  #   - mean_reciprocal_rank: 
  #       description: "Evaluate the average of the reciprocal ranks of the first relevant document for a set of queries."
  #       evaluation_method: "Calculate the reciprocal rank for each query and then compute the mean across all queries to assess retrieval performance."
  #   - precision_at_k: 
  #       description: "Evaluate the proportion of relevant documents in the top K retrieved results."
  #       evaluation_method: "For each query, calculate the number of relevant documents in the top K results divided by K, and average this across all queries."
  #   - recall_at_k: 
  #       description: "Evaluate the proportion of relevant documents retrieved out of all relevant documents available."
  #       evaluation_method: "For each query, calculate the number of relevant documents in the top K results divided by the total number of relevant documents, and average this across all queries."
  #   - ndcg_at_k: 
  #       description: "Evaluate the relevance of retrieved documents while considering their positions in the ranked list."
  #       evaluation_method: "Calculate the Normalized Discounted Cumulative Gain (NDCG) for the top K results of each query, which accounts for both relevance and rank position, and average this across all queries."

