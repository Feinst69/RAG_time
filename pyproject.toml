[project]
name = "rag-time"
version = "0.1.0"
description = "Hybrid RAG with Qdrant – dense (ColBERT/PyLate) + sparse (BM25) + late-interaction reranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # existing
    "faiss-cpu>=1.13.2",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.1",
    "langchain-openai>=1.1.12",
    "langchain-openrouter>=0.2.1",
    "pandas",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.1",
    # qdrant rag
    "qdrant-client[fastembed]>=1.14.0",
    "pylate>=1.1.0",
    "typer>=0.15.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "notebook>=7.5.5",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_rag"]
